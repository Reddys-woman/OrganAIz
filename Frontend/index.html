<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recall - Remembers what you Forgot</title>


    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="container">
        <!-- ===========================
             SIDEBAR
        ============================ -->
        <aside class="sidebar">
            <div>
                <div class="logo">
                    <i class="fa-solid fa-brain"></i>
                    <h1>Recall</h1>
                </div>
                <!-- Upload Button -->
                <button class="upload-btn" id="uploadBtn" type="button">

                    <i class="fa-solid fa-plus"></i>

                    <div>

                        <h3>Add Memory</h3>

                        <p>Upload</p>

                    </div>

                </button>

                <!-- Navigation -->

                <nav class="menu">

                    <a href="#" class="active">

                        <i class="fa-solid fa-house"></i>



                    </a>

                
                    <a href="#">

                        <i class="fa-solid fa-image"></i>



                    </a>

                    <a href="#">

                        <i class="fa-solid fa-folder"></i>



                    </a>

                
                    <a href="#">

                        <i class="fa-solid fa-trash"></i>



                    </a>

                </nav>

                <!-- Sources -->

                <div class="sources">

                    <h4>YOUR FILES</h4>

                    <div class="source">

                        <span class="types">

                            <i class="fa-regular fa-image images"></i>


                        </span>

                        <span class="count"></span>

                    </div>

                    <div class="source">

                        <span class="types">

                            <i class="fa-solid fa-microphone voice-notes"></i>


                        </span>

                        <span class="count"></span>

                    </div>

                    <div class="source">

                        <span class="types">

                            <i class="fa-regular fa-file pdf"></i>


                        </span>

                        <span class="count"></span>

                    </div>

                </div>

            </div>

            <!-- Bottom Sidebar -->

            <div>

                <div class="storage-card">

                    <h3>Storage Used</h3>

                    <div class="progress">

                        <div class="progress-fill"></div>

                    </div>

                    <p>2.4 GB / 10 GB</p>

                </div>

            </div>

        </aside>

        <!-- ===========================
             MAIN CONTENT
        ============================ -->

        <main class="content">

            <!-- Top Bar -->

            <header class="topbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text"
                        placeholder='Search your memories... (e.g. "hackathon deadline", "shopping list")'>

                </div>

                <div class="top-icons">
                    <button>

                        <i class="fa-regular fa-moon"></i>

                    </button>

                    <img src="images/profile.jpg" alt="Profile">

                </div>

            </header>

            <!-- Hero -->

            <section class="hero">

                <div>

                    <h1>

                        Welcome, User! 👋

                    </h1>
                </div>

            </section>

            <!-- Statistics -->

            <section class="stats">

                <div class="stat-card">

                    <i class="fa-solid fa-box purple"></i>

                    <h2></h2>

                    <p>Total Memories</p>

                </div>

                <div class="stat-card">

                    <i class="fa-solid fa-calendar purple2"></i>

                    <h2></h2>

                    <p>Today</p>

                </div>

                <div class="stat-card">

                    <i class="fa-solid fa-folder pureple3"></i>

                    <h2></h2>

                    <p>Collections</p>

                </div>

                <div class="stat-card">

                    <i class="fa-solid fa-fire purple3"></i>

                    <h2>_ Days</h2>

                    <p>Recall Streak</p>

                </div>

            </section>

            <!-- Dashboard Grid Starts Here -->

            <div class="dashboard-grid">

                <!-- ===========================
     LEFT COLUMN
=========================== -->

                <div class="left-column">

                    <!-- Recent Memories -->

                    <section class="section1">

                        <div class="section-header">

                            <h2>Recent Memories</h2>

                            <a href="#">View All</a>

                        </div>

                        <div class="memory-grid" id="memoryGrid">

                        </div>
                        <p id="emptyMessage" class="empty-message">
                            Well... It feels light. Upload some files!
                        </p>

                       
                </div>

                </section>

            </div>

    </div>
    <!-- End Dashboard Grid -->
    <!-- ===========================
     AI RECOMMENDATIONS
=========================== -->

    <section class="section2 card ai-section">

        <div class="section-header">
            <h2>AI Recommendations</h2>
        </div>

        <div class="ai-grid">

        </div>

    </section>


    <!-- ===========================
     QUICK UPLOAD
=========================== -->

    <section class="upload-section">

        <div class="upload-box" id="dropZone">

            <div class="upload-icon">
                ☁
            </div>

            <h3>Quick Upload</h3>

            <p>
                Drag & Drop screenshots here
                <br>
                or
            </p>

            <input type="file" id="fileInput" multiple hidden>

            <button type="button" onclick="document.getElementById('fileInput').click()">
                Browse Files
            </button>

        </div>

    </section>

    </main>

    </div>

    <script src="
    script.js"></script>

</body>

</html>
