<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recall - Remembers what you Forgot</title>


    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="container">
        <!-- ===========================
             SIDEBAR
        ============================ -->
        <aside class="sidebar">
            <div>
                <div class="logo">
                    <i class="fa-solid fa-brain"></i>
                    <h1>Recall</h1>
                </div>
                <!-- Upload Button -->
                <button class="upload-btn" id="uploadBtn" type="button">

                    <i class="fa-solid fa-plus"></i>

                    <div>

                        <h3>Add Memory</h3>

                        <p>Upload</p>

                    </div>

                </button>

                <!-- Navigation -->

                <nav class="menu">

                    <a href="#" class="active">

                        <i class="fa-solid fa-house"></i>



                    </a>

                
                    <a href="#">

                        <i class="fa-solid fa-image"></i>



                    </a>

                    <a href="#">

                        <i class="fa-solid fa-folder"></i>



                    </a>

                
                    <a href="#">

                        <i class="fa-solid fa-trash"></i>



                    </a>

                </nav>

                <!-- Sources -->

                <div class="your-files">

                    <h4>YOUR FILES</h4>

                    <div class="your-file">

                        <span class="types">

                            <i class="fa-regular fa-image images"></i>


                        </span>

                        <span class="count"></span>

                    </div>

                    <div class="your-file">

                        <span class="types">

                            <i class="fa-solid fa-microphone voice-notes"></i>


                        </span>

                        <span class="count"></span>

                    </div>

                    <div class="your-file">

                        <span class="types">

                            <i class="fa-regular fa-file pdf"></i>


                        </span>

                        <span class="count"></span>

                    </div>

                </div>

            </div>

            <!-- Bottom Sidebar -->

            <div>

                <div class="storage-card">

                    <h3>Storage Used</h3>

                    <div class="progress">

                        <div class="progress-fill"></div>

                    </div>

                    <p>2.4 GB / 10 GB</p>

                </div>

            </div>

        </aside>

        <!-- ===========================
             MAIN CONTENT
        ============================ -->

        <main class="content">

            <!-- Top Bar -->

            <header class="topbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text"
                        placeholder='Search your memories... (e.g. "hackathon deadline", "shopping list")'>

                </div>

                <div class="top-icons">
                    <button>

                        <i class="fa-regular fa-moon"></i>

                    </button>

                    <img src="/frontend/images/profile.jpg" alt="Profile">

                </div>

            </header>

          

    </main>

    </div>

    <script src="/frontend/script.js"></script>

</body>

</html>
